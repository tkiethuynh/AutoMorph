name: Build ARM64 Image from Upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/arm64-upstream-sync.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tkiethuynh/automorph

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out upstream holjab/AutoMorph (main)
        uses: actions/checkout@v4
        with:
          repository: holjab/AutoMorph
          ref: main

      - name: Get upstream commit SHA
        id: upstream
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Upstream main SHA: $SHA"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image is already up to date
        id: check
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          CURRENT_SHA=""
          if docker pull "$IMAGE" >/dev/null 2>&1; then
            CURRENT_SHA=$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE" 2>/dev/null || true)
          fi
          echo "Current image SHA: ${CURRENT_SHA:-none}"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$CURRENT_SHA" = "${{ steps.upstream.outputs.sha }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already up to date; skipping build."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Write version.json
        if: steps.check.outputs.skip != 'true'
        run: |
          cat <<EOF > web/version.json
          {
            "version": "0.${{ github.run_number }}",
            "tag": "main",
            "run_number": ${{ github.run_number }},
            "branch": "main",
            "commit": "${{ steps.upstream.outputs.sha }}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat web/version.json

      - name: Patch manager.py for per-app whatsNew changelogs
        if: steps.check.outputs.skip != 'true'
        run: |
          python3 - <<'PYEOF'
          from pathlib import Path

          p = Path("scripts/manager.py")
          src = p.read_text(encoding="utf-8")

          helper = '''    @staticmethod
    def _format_whats_new(v_details: dict) -> str:
        patch_info = v_details.get('patch', {}) or {}
        applied = patch_info.get('applied_patches', {}) or {}
        repos = patch_info.get('repos', []) or []
        morphe_ver = patch_info.get('morphe_desktop_version')
        lines = []
        if repos:
            short_repos = [r.replace('https://github.com/', '').replace('https://gitlab.com/', '') for r in repos]
            lines.append(f"Sources: {', '.join(short_repos)}")
        if morphe_ver and morphe_ver != 'Unknown':
            lines.append(f"Morphe: v{morphe_ver}")
        if applied:
            lines.append(f"Applied patches ({len(applied)}):")
            for name in sorted(applied.keys()):
                lines.append(f"- {name}")
        return "\\n".join(lines) if lines else "Patched with AutoMorph"

'''
          target_block = """                    'whatsNew': {
                        'en-US': 'new patches'
                    }"""
          replacement_block = """                    'whatsNew': {
                        'en-US': self._format_whats_new(v_details)
                    }"""

          assert target_block in src, "whatsNew target block not found in scripts/manager.py"
          assert "    def add_package(self):" in src, "FDroid.add_package not found"

          # Insert helper inside FDroid class (right before def add_package)
          src = src.replace("    def add_package(self):\n        index = {", helper + "    def add_package(self):\n        index = {", 1)
          src = src.replace(target_block, replacement_block, 1)
          p.write_text(src, encoding="utf-8")
          print("Patched scripts/manager.py successfully")
          PYEOF

      - name: Build and push ARM64 Docker image
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.upstream.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/holjab/AutoMorph
            org.opencontainers.image.revision=${{ steps.upstream.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
